<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>工事黒板カメラ</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
  :root {
    --board-green: #0d5938;
    --board-green-deep: #093f28;
    --frame: #d8d3c4;
    --bg: #15171a;
    --panel: #1f2226;
    --line: #34383e;
    --text: #f2f0ea;
    --text-dim: #9aa0a8;
    --accent: #e8a13a; /* 現場の保安色（山吹） */
    --danger: #d9534f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    display: flex; flex-direction: column;
    height: 100dvh;
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- ヘッダー ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: .08em; }
  header h1 span { color: var(--accent); margin-right: 6px; }
  header h1 .ver { color: var(--text-dim); font-size: 11px; font-weight: 400; margin-left: 8px; letter-spacing: 0; }
  #modeBtn, #backCamBtn {
    font-size: 12px; color: var(--text-dim);
    background: none; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px;
  }
  #backCamBtn { color: var(--accent); border-color: var(--accent); margin-right: 6px; }

  /* ---------- カメラ／写真エリア ---------- */
  #stage {
    position: relative; flex: 1; overflow: hidden;
    background: #000;
    touch-action: none;
    display: flex; align-items: center; justify-content: center;
  }
  #frame {
    position: relative;
    aspect-ratio: 4 / 3;
    width: 100%;
    max-height: 100%;
    background: #000;
    overflow: hidden;
  }
  #video, #stillImg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  #stillImg { display: none; }
  #stageHint {
    position: absolute; inset: 0;
    z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px; color: var(--text-dim);
    font-size: 14px; line-height: 1.8;
  }
  #stageHint button {
    font-size: 15px; font-weight: 600;
    color: #1a1a1a; background: var(--accent);
    border: none; border-radius: 10px; padding: 14px 22px;
  }
  #stageHint .sub { font-size: 12px; }

  /* ---------- 黒板オーバーレイ ---------- */
  #board {
    position: fixed;
    left: 0; top: 0;
    z-index: 9999;
    will-change: transform;
    width: 190px;
    background: var(--board-green);
    border: 4px solid var(--frame);
    box-shadow: 0 4px 16px rgba(0,0,0,.45);
    color: #fff;
    padding: 8px 10px;
    transform-origin: top left;
    cursor: grab;
  }
  #board .bcompany {
    text-align: right;
    font-size: 11px;
    font-weight: 700;
    padding-top: 4px;
    border-top: 1px solid rgba(255,255,255,.55);
  }
  #board .brow { display: flex; border-bottom: 1px solid rgba(255,255,255,.55); padding: 4px 0; }
  #board .brow:last-child { border-bottom: none; }
  #board .blabel { width: 58px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  #board .bval { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; }
  #board .bmemo { min-height: 46px; font-size: 12px; padding: 5px 0 2px; line-height: 1.5; white-space: pre; overflow: hidden; }

  /* ---------- 操作パネル ---------- */
  #panel {
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .fieldRow { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .fieldRow label {
    width: 48px; font-size: 11px; color: var(--text-dim); flex-shrink: 0;
  }
  .fieldRow input, .fieldRow textarea {
    flex: 1; min-width: 0;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 10px; font-size: 16px;
    font-family: inherit;
    -webkit-user-select: text; user-select: text;
  }
  .fieldRow textarea { resize: none; line-height: 1.45; }
  .fieldRow input:focus, .fieldRow textarea:focus { outline: none; border-color: var(--accent); }
  .micBtn {
    width: 38px; height: 40px; flex-shrink: 0;
    border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
    font-size: 16px; line-height: 1;
  }
  .micBtn.rec { background: var(--danger); border-color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  .ddBtn {
    width: 32px; height: 40px; flex-shrink: 0;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text-dim);
    font-size: 13px;
  }

  /* ---------- 登録リスト選択シート ---------- */
  #picker {
    position: fixed; inset: 0; z-index: 10002;
    background: rgba(0,0,0,.55);
    display: none; align-items: flex-end;
  }
  #pickerSheet {
    width: 100%;
    background: var(--panel);
    border-radius: 16px 16px 0 0;
    max-height: 65dvh;
    display: flex; flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #pickerTitle {
    text-align: center; font-size: 14px; font-weight: 600;
    padding: 14px; color: var(--text-dim);
    border-bottom: 1px solid var(--line);
  }
  #pickerList { overflow-y: auto; flex: 1; }
  .pickItem {
    display: flex; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .pickItem .pv {
    flex: 1; padding: 15px 16px; font-size: 16px; color: var(--text);
    white-space: pre-wrap; word-break: break-all;
  }
  .pickItem .px {
    width: 52px; height: 52px; flex-shrink: 0;
    background: none; border: none; color: var(--text-dim); font-size: 18px;
  }
  .pickEmpty { padding: 28px 16px; text-align: center; color: var(--text-dim); font-size: 14px; line-height: 1.7; }
  #pickerClose {
    margin: 10px 14px; padding: 14px 0;
    font-size: 15px; font-weight: 600;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }

  #batchBar {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  #batchBar button {
    flex: 1; padding: 11px 0; font-size: 14px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  #batchBar #saveAllBtn {
    background: var(--accent); color: #1a1a1a; border: none; font-weight: 700;
  }
  #batchBar b { color: var(--accent); font-size: 16px; }
  #saveAllBtn b { color: #1a1a1a; }

  #resultList {
    display: grid !important;
    grid-template-columns: repeat(var(--cols, 1), 1fr);
    gap: 8px;
    align-content: start;
    overflow-y: auto !important;
    touch-action: pan-y;
  }
  #resultList img { width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; }
  #resultList .empty { color: var(--text-dim); font-size: 14px; margin: auto; grid-column: 1 / -1; text-align: center; }
  .shotItem { position: relative; }
  .shotItem .shotDel {
    position: absolute; top: 4px; right: 4px;
    padding: 6px 10px; font-size: 12px; font-weight: 600;
    background: rgba(0,0,0,.7); color: #fff;
    border: 1px solid rgba(255,255,255,.4); border-radius: 8px;
  }
  #listCtrl {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    padding: 8px 14px 0;
  }
  #listCtrl button {
    width: 44px; height: 38px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 18px;
  }
  #listCtrl span { font-size: 13px; color: var(--text-dim); min-width: 56px; text-align: center; }

  #controls {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 4px;
  }
  .sizeBtns { display: flex; gap: 8px; }
  .sizeBtns button, #toggleFields {
    width: 46px; height: 46px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 20px;
  }
  #toggleFields { font-size: 13px; width: auto; padding: 0 12px; color: var(--text-dim); }
  #shutter {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 5px solid var(--text);
    background: transparent;
    position: relative;
  }
  #shutter::after {
    content: ""; position: absolute; inset: 5px;
    border-radius: 50%; background: var(--text);
    transition: transform .1s;
  }
  #shutter:active::after { transform: scale(.85); }

  /* ---------- 結果画面 ---------- */
  #result {
    position: fixed; inset: 0; z-index: 10000;
    background: var(--bg);
    display: none; flex-direction: column;
  }
  #result .rTop { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 12px; }
  #resultImg { max-width: 100%; max-height: 100%; border: 1px solid var(--line); }
  #result .rBtns {
    display: flex; gap: 10px;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
  }
  #result .rBtns button {
    flex: 1; padding: 15px 0; font-size: 15px; font-weight: 600;
    border-radius: 10px; border: none;
  }
  #saveBtn { background: var(--accent); color: #1a1a1a; }
  #retryBtn { background: var(--panel); color: var(--text); border: 1px solid var(--line) !important; }
  #resultNote { text-align: center; font-size: 12px; color: var(--text-dim); padding-bottom: 6px; }

  #toast {
    position: fixed; left: 50%; top: 0; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff;
    padding: 9px 16px; border-radius: 16px; font-size: 13px;
    display: none; z-index: 10001; max-width: 90%; text-align: center;
  }
  .hidden { display: none !important; }

  /* ---------- 黒板／メモ切替タブ ---------- */
  #toolTabs { display: flex; gap: 6px; margin-bottom: 10px; }
  #toolTabs button {
    flex: 1; padding: 9px 0; font-size: 13px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text-dim);
  }
  #toolTabs button.active {
    background: var(--accent); color: #1a1a1a; font-weight: 700; border-color: var(--accent);
  }

  /* ---------- メモ・書込みツール ---------- */
  #memoTools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  #memoTools button {
    padding: 9px 10px; font-size: 13px;
    border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text);
  }
  #memoTools #penBtn.active { background: var(--danger); border-color: var(--danger); color: #fff; }
  .inkColor { width: 34px; height: 34px; border-radius: 50% !important; padding: 0 !important; border: 2px solid var(--line) !important; }
  .inkColor.active { border-color: #fff !important; box-shadow: 0 0 0 2px var(--accent); }

  /* ---------- 吹き出し ---------- */
  .bubble {
    position: fixed; z-index: 9995;
    transform-origin: top left;
    background: #fff; color: #1a1a1a;
    border: 2px solid #e0312d; border-radius: 8px;
    padding: 8px; font-size: 13px; line-height: 1.4;
    max-width: 200px; white-space: pre-wrap; word-break: break-all;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    cursor: grab;
  }
  .bubble.sel { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .bubble::after {
    content: ""; position: absolute; left: 14px; bottom: -9px;
    border-width: 9px 7px 0 7px; border-style: solid;
    border-color: #e0312d transparent transparent transparent;
  }

  /* ---------- ペン書込みレイヤー ---------- */
  #inkCanvas {
    position: fixed; z-index: 9990;
    pointer-events: none; display: none;
    touch-action: none;
  }

  /* ---------- 撮影直後プレビュー ---------- */
  #shotHint {
    position: fixed; left: 0; right: 0; bottom: 0;
    z-index: 9996; display: none;
    background: rgba(0,0,0,.85); color: #fff;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    font-size: 13px; text-align: center; line-height: 1.5;
    pointer-events: none;
  }
  #shotHint b { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1><span>■</span>工事黒板カメラ<span class="ver">v2.8</span></h1>
  <div>
    <button id="backCamBtn" class="hidden">📷 カメラへ</button>
    <button id="modeBtn">写真を選ぶ</button>
  </div>
</header>

<div id="stage">
  <div id="frame">
    <video id="video" autoplay playsinline muted></video>
    <img id="stillImg" alt="">
  </div>
  <div id="stageHint">
    <div>カメラを起動して、黒板を重ねて撮影します。</div>
    <button id="startCamBtn">カメラを起動する</button>
    <div class="sub">カメラが使えない場合は、右上の「写真を選ぶ」で<br>撮影済みの写真に黒板を合成できます。</div>
  </div>
</div>

<div id="panel">
  <div id="batchBar" class="hidden">
    <button id="openListBtn">保存待ち <b id="batchCount">0</b>枚</button>
    <button id="saveAllBtn">まとめて保存</button>
  </div>
  <div id="toolTabs">
    <button id="tabBoard" class="active">黒板</button>
    <button id="tabMemo">メモ・書込み</button>
  </div>
  <div id="fields">
    <div class="fieldRow">
      <label>工事名</label>
      <input id="inProject" type="text" placeholder="例：◯◯邸 新築工事">
      <button class="ddBtn" data-target="inProject">▼</button>
      <button class="micBtn" data-target="inProject">🎤</button>
    </div>
    <div class="fieldRow">
      <label>工種</label>
      <input id="inWork" type="text" placeholder="例：基礎工事">
      <button class="ddBtn" data-target="inWork">▼</button>
      <button class="micBtn" data-target="inWork">🎤</button>
    </div>
    <div class="fieldRow">
      <label>撮影内容</label>
      <textarea id="inMemo" rows="2" placeholder="例：配筋検査 全景"></textarea>
      <button class="ddBtn" data-target="inMemo">▼</button>
      <button class="micBtn" data-target="inMemo">🎤</button>
    </div>
  </div>
  <div id="memoPanel" class="hidden">
    <div class="fieldRow">
      <label>メモ</label>
      <input id="inBubble" type="text" placeholder="吹き出しの文字を入力">
      <button class="micBtn" data-target="inBubble">🎤</button>
    </div>
    <div id="memoTools">
      <button id="addBubbleBtn">＋吹き出し</button>
      <button id="delBubbleBtn">削除</button>
      <button id="penBtn">🖊 ペン</button>
      <button class="inkColor active" data-color="#e0312d" style="background:#e0312d" aria-label="赤"></button>
      <button class="inkColor" data-color="#ffd400" style="background:#ffd400" aria-label="黄"></button>
      <button class="inkColor" data-color="#ffffff" style="background:#ffffff" aria-label="白"></button>
      <button id="undoInkBtn">↩ 取消</button>
    </div>
  </div>
  <div id="controls">
    <button id="toggleFields">入力を隠す</button>
    <button id="shutter" aria-label="撮影"></button>
    <div class="sizeBtns">
      <button id="sizeDown" aria-label="黒板を小さく">−</button>
      <button id="sizeUp" aria-label="黒板を大きく">＋</button>
    </div>
  </div>
</div>

<div id="result">
  <div id="listCtrl">
    <button id="colBig">拡大</button>
    <span id="colLabel">1列</span>
    <button id="colSmall">縮小</button>
  </div>
  <div class="rTop" id="resultList"></div>
  <div id="resultNote">保存できない場合は、各画像を長押し →「写真に追加」でも保存できます</div>
  <div class="rBtns">
    <button id="retryBtn">閉じる</button>
    <button id="saveBtn">まとめて保存</button>
  </div>
</div>

<input id="fileInput" type="file" accept="image/*" class="hidden">

<!-- 工事黒板（最前面に固定表示） -->
<div id="board">
  <div class="brow"><div class="blabel">工事名</div><div class="bval" id="bProject">　</div></div>
  <div class="brow"><div class="blabel">工　種</div><div class="bval" id="bWork">　</div></div>
  <div class="bmemo" id="bMemo">　</div>
  <div class="bcompany">㈱千田工務店</div>
</div>

<canvas id="inkCanvas"></canvas>
<div id="shotHint">撮影しました。<b>画面をタップ</b>すると書込み編集できます<br>（<b id="shotCount">3</b>秒後に自動保存）</div>

<div id="picker">
  <div id="pickerSheet">
    <div id="pickerTitle"></div>
    <div id="pickerList"></div>
    <button id="pickerClose">閉じる</button>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), frame = $('frame'), video = $('video'), stillImg = $('stillImg');
  const board = $('board'), hint = $('stageHint');
  let mode = 'live';          // 'live' | 'still'
  let stream = null;
  let stillImage = null;      // 写真モードで読み込んだ Image
  let scale = 1.0;
  let pos = null;             // 黒板の左上位置（stage内px）

  /* ---------- 入力欄 → 黒板へ反映 ---------- */
  // 文字サイズ自動調整用の測定キャンバス
  const measCtx = document.createElement('canvas').getContext('2d');
  function fitSize(text, maxW, base, min) {
    let s = base;
    while (s > min) {
      measCtx.font = `${s}px "Hiragino Sans", sans-serif`;
      if (measCtx.measureText(text).width <= maxW) break;
      s -= 0.5;
    }
    return s;
  }
  function refreshBoardText() {
    const valW = 190 - 20 - 58;   // 黒板幅 − 余白 − ラベル幅
    const memoW = 190 - 20;
    const MIN_FS = 9;             // 文字サイズの下限（これ以下は自動改行に切替）
    const p = $('inProject').value, w = $('inWork').value, m = $('inMemo').value;

    const applyFit = (el, text, maxW) => {
      el.textContent = text || '　';
      const fs = fitSize(text, maxW, 12, MIN_FS);
      el.style.fontSize = fs + 'px';
      // 下限でも収まらない場合は自動改行に切り替える
      measCtx.font = `${fs}px "Hiragino Sans", sans-serif`;
      const over = measCtx.measureText(text || '').width > maxW;
      el.style.whiteSpace = over ? 'normal' : 'nowrap';
      el.style.wordBreak = over ? 'break-all' : 'normal';
    };
    applyFit($('bProject'), p, valW);
    applyFit($('bWork'), w, valW);

    // 撮影内容：改行ごとに測り、全行が収まるサイズに統一。下限を超えたら自動改行
    const lines = (m || '　').split('\n');
    let ms = 12;
    lines.forEach(line => { ms = Math.min(ms, fitSize(line, memoW, 12, MIN_FS)); });
    measCtx.font = `${ms}px "Hiragino Sans", sans-serif`;
    const memoOver = lines.some(line => measCtx.measureText(line).width > memoW);
    $('bMemo').textContent = m || '　';
    $('bMemo').style.fontSize = ms + 'px';
    $('bMemo').style.whiteSpace = memoOver ? 'pre-wrap' : 'pre';
    $('bMemo').style.wordBreak = memoOver ? 'break-all' : 'normal';
    applyBoard(); // 黒板の高さ変化に合わせて枠内に収め直す
  }
  const bind = (inputId) => {
    $(inputId).addEventListener('input', refreshBoardText);
  };
  bind('inProject');
  bind('inWork');
  bind('inMemo');

  /* ---------- 入力の登録リスト（工事名・工種） ---------- */
  const HIST_KEY = 'kokuban-history';
  const HIST_LABEL = { inProject: '工事名', inWork: '工種', inMemo: '撮影内容' };
  let hist = { inProject: [], inWork: [], inMemo: [] };
  try {
    const saved = JSON.parse(localStorage.getItem(HIST_KEY));
    if (saved && typeof saved === 'object') hist = Object.assign(hist, saved);
  } catch (e) { /* 記憶機能が使えない環境では今回限りの動作になる */ }
  function saveHist() {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch (e) {}
  }
  function addHist(fieldId, value) {
    value = (value || '').trim();
    if (!value || !hist[fieldId]) return;
    hist[fieldId] = [value, ...hist[fieldId].filter(v => v !== value)].slice(0, 30);
    saveHist();
  }

  function openPicker(fieldId) {
    const list = $('pickerList');
    $('pickerTitle').textContent = HIST_LABEL[fieldId] + ' を選択';
    list.innerHTML = '';
    if (hist[fieldId].length === 0) {
      list.innerHTML = '<div class="pickEmpty">まだ登録がありません。<br>入力して撮影すると、自動でここに登録されます。</div>';
    } else {
      hist[fieldId].forEach(v => {
        const row = document.createElement('div');
        row.className = 'pickItem';
        const pv = document.createElement('div');
        pv.className = 'pv';
        pv.textContent = v;
        pv.addEventListener('click', () => {
          const input = $(fieldId);
          input.value = v;
          input.dispatchEvent(new Event('input'));
          $('picker').style.display = 'none';
        });
        const px = document.createElement('button');
        px.className = 'px';
        px.textContent = '✕';
        px.addEventListener('click', () => {
          hist[fieldId] = hist[fieldId].filter(x => x !== v);
          saveHist();
          openPicker(fieldId);
        });
        row.appendChild(pv);
        row.appendChild(px);
        list.appendChild(row);
      });
    }
    $('picker').style.display = 'flex';
  }
  document.querySelectorAll('.ddBtn').forEach(btn => {
    btn.addEventListener('click', () => openPicker(btn.dataset.target));
  });
  $('pickerClose').addEventListener('click', () => $('picker').style.display = 'none');
  $('picker').addEventListener('click', e => { if (e.target === $('picker')) $('picker').style.display = 'none'; });

  /* ---------- トースト ---------- */
  let toastTimer;
  function toast(msg, ms = 2200) {
    const t = $('toast');
    t.textContent = msg;
    // カメラ画像（frame）の下端のすぐ下に表示する
    const r = frame.getBoundingClientRect();
    t.style.top = (r.bottom + 8) + 'px';
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.style.display = 'none', ms);
  }

  /* ---------- カメラ起動 ---------- */
  async function startCamera() {
    cancelPreview && cancelPreview();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      video.onloadedmetadata = () => showBoard();
      // 写真モードからの復帰処理
      stillImg.style.display = 'none';
      video.style.display = 'block';
      stillImage = null;
      mode = 'live';
      $('modeBtn').textContent = '写真を選ぶ';
      $('backCamBtn').classList.add('hidden');
      hint.classList.add('hidden');
      showBoard();
    } catch (e) {
      toast('カメラを起動できませんでした。「写真を選ぶ」をお試しください', 3500);
    }
  }
  $('startCamBtn').addEventListener('click', startCamera);
  $('backCamBtn').addEventListener('click', startCamera);

  /* ---------- 写真モード ---------- */
  $('modeBtn').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    toast('写真を読み込んでいます…');
    const reader = new FileReader();
    reader.onerror = () => toast('写真を読み込めませんでした', 3000);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => toast('この写真の形式は表示できませんでした', 3000);
      img.onload = () => {
        stillImage = img;
        stillImg.src = reader.result;
        stillImg.style.display = 'block';
        video.style.display = 'none';
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
        mode = 'still';
        $('modeBtn').textContent = '別の写真を選ぶ';
        $('backCamBtn').classList.remove('hidden');
        hint.classList.add('hidden');
        showBoard();
        toast('黒板の位置を調整して、シャッターで合成します');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  /* ---------- 黒板の表示と移動 ---------- */
  function showBoard() {
    const r = frame.getBoundingClientRect();
    if (!pos) pos = { x: r.width * 0.05, y: r.height * 0.35 };
    applyBoard();
  }
  // 起動直後から黒板を表示しておく
  window.addEventListener('load', showBoard);
  window.addEventListener('resize', showBoard);
  showBoard();
  function applyBoard() {
    if (!pos) return;
    const r = frame.getBoundingClientRect();
    // 黒板がカメラ枠の外に出ないように制限する
    const bw = board.offsetWidth * scale;
    const bh = board.offsetHeight * scale;
    pos.x = Math.min(Math.max(pos.x, 0), Math.max(0, r.width - bw));
    pos.y = Math.min(Math.max(pos.y, 0), Math.max(0, r.height - bh));
    board.style.left = (r.left + pos.x) + 'px';
    board.style.top = (r.top + pos.y) + 'px';
    board.style.transform = `scale(${scale}) translateZ(0)`;
  }

  // ドラッグ（1本指）＋ ピンチ（2本指）
  let drag = null, pinch = null;
  board.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      const t = e.touches[0];
      drag = { sx: t.clientX, sy: t.clientY, ox: pos.x, oy: pos.y };
    } else if (e.touches.length === 2) {
      drag = null;
      pinch = { d: dist(e.touches), s: scale };
    }
  }, { passive: false });
  board.addEventListener('touchmove', e => {
    e.preventDefault();
    if (pinch && e.touches.length === 2) {
      scale = Math.min(2.5, Math.max(0.5, pinch.s * dist(e.touches) / pinch.d));
      applyBoard();
    } else if (drag && e.touches.length === 1) {
      const t = e.touches[0];
      pos.x = drag.ox + (t.clientX - drag.sx);
      pos.y = drag.oy + (t.clientY - drag.sy);
      applyBoard();
    }
  }, { passive: false });
  board.addEventListener('touchend', () => { drag = null; pinch = null; });
  const dist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);

  // マウス（PCでの確認用）
  board.addEventListener('mousedown', e => {
    drag = { sx: e.clientX, sy: e.clientY, ox: pos.x, oy: pos.y };
    const mv = ev => { pos.x = drag.ox + ev.clientX - drag.sx; pos.y = drag.oy + ev.clientY - drag.sy; applyBoard(); };
    const up = () => { drag = null; window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
    window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
  });

  $('sizeUp').addEventListener('click', () => { scale = Math.min(2.5, scale + 0.1); applyBoard(); });
  $('sizeDown').addEventListener('click', () => { scale = Math.max(0.5, scale - 0.1); applyBoard(); });

  /* ---------- ツール切替（黒板／メモ・書込み） ---------- */
  let tool = 'board';
  const inkCanvas = $('inkCanvas');
  const inkCtx = inkCanvas.getContext('2d');
  function setTool(t) {
    tool = t;
    $('tabBoard').classList.toggle('active', t === 'board');
    $('tabMemo').classList.toggle('active', t === 'memo');
    $('fields').classList.toggle('hidden', t !== 'board');
    $('memoPanel').classList.toggle('hidden', t !== 'memo');
    board.style.display = t === 'board' ? '' : 'none';
    document.querySelectorAll('.bubble').forEach(el => el.style.display = t === 'memo' ? '' : 'none');
    inkCanvas.style.display = t === 'memo' ? 'block' : 'none';
    layoutAnn();
    applyBoard();
  }
  $('tabBoard').addEventListener('click', () => setTool('board'));
  $('tabMemo').addEventListener('click', () => setTool('memo'));

  /* ---------- 吹き出し ---------- */
  let bubbles = [];      // {x, y(枠内の比率), scale, text, el}
  let selBubble = null;
  function addBubble(text) {
    const b = { x: 0.3, y: 0.25, scale: 1, text: text || 'メモ', el: null };
    const el = document.createElement('div');
    el.className = 'bubble';
    document.body.appendChild(el);
    b.el = el;
    bubbles.push(b);
    attachBubbleEvents(b);
    b.el.textContent = b.text;
    selectBubble(b);
    layoutAnn();
  }
  function selectBubble(b) {
    selBubble = b;
    document.querySelectorAll('.bubble').forEach(el => el.classList.remove('sel'));
    if (b) { b.el.classList.add('sel'); $('inBubble').value = b.text; }
    else $('inBubble').value = '';
  }
  function attachBubbleEvents(b) {
    let bd = null, bp = null;
    b.el.addEventListener('touchstart', e => {
      e.preventDefault();
      selectBubble(b);
      const r = frame.getBoundingClientRect();
      if (e.touches.length === 1) {
        const t = e.touches[0];
        bd = { sx: t.clientX, sy: t.clientY, ox: b.x * r.width, oy: b.y * r.height, rw: r.width, rh: r.height };
      } else if (e.touches.length === 2) {
        bd = null;
        bp = { d: dist(e.touches), s: b.scale };
      }
    }, { passive: false });
    b.el.addEventListener('touchmove', e => {
      e.preventDefault();
      if (bp && e.touches.length === 2) {
        b.scale = Math.min(2.5, Math.max(0.6, bp.s * dist(e.touches) / bp.d));
        layoutAnn();
      } else if (bd && e.touches.length === 1) {
        const t = e.touches[0];
        b.x = (bd.ox + t.clientX - bd.sx) / bd.rw;
        b.y = (bd.oy + t.clientY - bd.sy) / bd.rh;
        layoutAnn();
      }
    }, { passive: false });
    b.el.addEventListener('touchend', () => { bd = null; bp = null; });
    b.el.addEventListener('mousedown', e => {
      selectBubble(b);
      const r = frame.getBoundingClientRect();
      const st = { sx: e.clientX, sy: e.clientY, ox: b.x * r.width, oy: b.y * r.height };
      const mv = ev => { b.x = (st.ox + ev.clientX - st.sx) / r.width; b.y = (st.oy + ev.clientY - st.sy) / r.height; layoutAnn(); };
      const up = () => { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
    });
  }
  $('addBubbleBtn').addEventListener('click', () => addBubble($('inBubble').value.trim() || 'メモ'));
  $('delBubbleBtn').addEventListener('click', () => {
    if (!selBubble) { toast('削除する吹き出しをタップで選んでください'); return; }
    selBubble.el.remove();
    bubbles = bubbles.filter(b => b !== selBubble);
    selectBubble(null);
    toast('吹き出しを削除しました');
  });
  $('inBubble').addEventListener('input', () => {
    if (!selBubble) {
      if ($('inBubble').value.trim()) addBubble($('inBubble').value);
      return;
    }
    selBubble.text = $('inBubble').value;
    selBubble.el.textContent = selBubble.text || ' ';
    layoutAnn();
  });

  /* ---------- ペン書込み ---------- */
  let penOn = false, inkColor = '#e0312d', strokes = [];
  $('penBtn').addEventListener('click', () => {
    penOn = !penOn;
    $('penBtn').classList.toggle('active', penOn);
    inkCanvas.style.pointerEvents = penOn ? 'auto' : 'none';
    toast(penOn ? 'ペンON：指でなぞって書込みできます' : 'ペンOFF');
  });
  document.querySelectorAll('.inkColor').forEach(btn => {
    btn.addEventListener('click', () => {
      inkColor = btn.dataset.color;
      document.querySelectorAll('.inkColor').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
    });
  });
  $('undoInkBtn').addEventListener('click', () => {
    if (strokes.length === 0) { toast('取り消す書込みがありません'); return; }
    strokes.pop();
    redrawInk();
  });
  let curStroke = null;
  inkCanvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (!penOn || e.touches.length !== 1) return;
    const r = frame.getBoundingClientRect();
    const t = e.touches[0];
    curStroke = { color: inkColor, pts: [{ x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height }] };
    strokes.push(curStroke);
  }, { passive: false });
  inkCanvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!curStroke || e.touches.length !== 1) return;
    const r = frame.getBoundingClientRect();
    const t = e.touches[0];
    curStroke.pts.push({ x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height });
    redrawInk();
  }, { passive: false });
  inkCanvas.addEventListener('touchend', () => { curStroke = null; });

  function redrawInk() {
    inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
    inkCtx.lineCap = 'round'; inkCtx.lineJoin = 'round';
    strokes.forEach(s => {
      inkCtx.strokeStyle = s.color;
      inkCtx.lineWidth = 4;
      inkCtx.beginPath();
      s.pts.forEach((p, i) => {
        const px = p.x * inkCanvas.width, py = p.y * inkCanvas.height;
        i ? inkCtx.lineTo(px, py) : inkCtx.moveTo(px, py);
      });
      inkCtx.stroke();
    });
  }

  /* ---------- メモ・書込みレイヤーの配置 ---------- */
  function layoutAnn() {
    const r = frame.getBoundingClientRect();
    bubbles.forEach(b => {
      b.x = Math.min(Math.max(b.x, 0), 0.92);
      b.y = Math.min(Math.max(b.y, 0), 0.92);
      b.el.style.left = (r.left + b.x * r.width) + 'px';
      b.el.style.top = (r.top + b.y * r.height) + 'px';
      b.el.style.transform = `scale(${b.scale}) translateZ(0)`;
    });
    inkCanvas.style.left = r.left + 'px';
    inkCanvas.style.top = r.top + 'px';
    inkCanvas.style.width = r.width + 'px';
    inkCanvas.style.height = r.height + 'px';
    if (inkCanvas.width !== Math.round(r.width)) {
      inkCanvas.width = Math.round(r.width);
      inkCanvas.height = Math.round(r.height);
    }
    redrawInk();
  }
  window.addEventListener('resize', layoutAnn);

  /* ---------- メモ・吹き出しを写真へ合成 ---------- */
  function roundRect(ctx, x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }
  function drawAnnotations(ctx, k) {
    // ペン書込み
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    strokes.forEach(s => {
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 4 * k;
      ctx.beginPath();
      s.pts.forEach((p, i) => {
        const px = p.x * OUT_W, py = p.y * OUT_H;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      });
      ctx.stroke();
    });
    // 吹き出し
    ctx.textBaseline = 'alphabetic';
    bubbles.forEach(b => {
      const q = b.scale * k;
      const fs = 13 * q, pad = 8 * q, maxW = 184 * q;
      ctx.font = `${fs}px "Hiragino Sans", sans-serif`;
      const lines = [];
      (b.text || ' ').split('\n').forEach(l => lines.push(...wrapLine(ctx, l, maxW)));
      let tw = 0;
      lines.forEach(l => tw = Math.max(tw, ctx.measureText(l).width));
      const lh = fs * 1.4;
      const bw = tw + pad * 2 + 4 * q;
      const bh = lines.length * lh + pad * 2;
      const bx = b.x * OUT_W, by = b.y * OUT_H;
      // 本体
      roundRect(ctx, bx, by, bw, bh, 8 * q);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#e0312d';
      ctx.lineWidth = 2 * q;
      ctx.stroke();
      // しっぽ
      ctx.beginPath();
      ctx.moveTo(bx + 14 * q, by + bh - 1 * q);
      ctx.lineTo(bx + 10 * q, by + bh + 9 * q);
      ctx.lineTo(bx + 28 * q, by + bh - 1 * q);
      ctx.closePath();
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#e0312d';
      ctx.stroke();
      // 文字
      ctx.fillStyle = '#1a1a1a';
      let ty = by + pad + fs * 0.85;
      lines.forEach(l => {
        ctx.fillText(l, bx + pad + 2 * q, ty);
        ty += lh;
      });
    });
  }

  $('toggleFields').addEventListener('click', () => {
    const f = tool === 'board' ? $('fields') : $('memoPanel');
    const hidden = f.classList.toggle('hidden');
    $('toggleFields').textContent = hidden ? '入力を表示' : '入力を隠す';
    applyBoard();
    layoutAnn();
  });

  /* ---------- 音声入力（Web Speech API / ja-JP） ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let activeRec = null;
  document.querySelectorAll('.micBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = $(btn.dataset.target);
      if (!SR) {
        input.focus();
        toast('入力欄をタップし、キーボード右下のマイク🎤で音声入力できます', 4000);
        return;
      }
      if (activeRec) { activeRec.stop(); return; }
      const rec = new SR();
      rec.lang = 'ja-JP';
      rec.interimResults = true;
      rec.continuous = false;
      activeRec = rec;
      btn.classList.add('rec');
      let got = false;
      rec.onresult = e => {
        got = true;
        let text = '';
        for (const r of e.results) text += r[0].transcript;
        input.value = text;
        input.dispatchEvent(new Event('input'));
      };
      rec.onerror = () => {
        input.focus();
        toast('マイクが使えないため、キーボード右下のマイク🎤をご利用ください', 4000);
      };
      rec.onend = () => {
        btn.classList.remove('rec');
        activeRec = null;
        if (!got) {
          input.focus();
          toast('音声が認識できない場合は、キーボード右下のマイク🎤が使えます', 4000);
        }
      };
      rec.start();
      toast('どうぞお話しください…');
    });
  });

  /* ---------- 撮影・合成 ---------- */
  const OUT_W = 1280, OUT_H = 960; // 出力サイズ固定（4:3横・約120万画素：工事写真標準）
  /* ---------- 合成して保存待ちに追加 ---------- */
  function commitShot() {
    const r = frame.getBoundingClientRect();
    let srcW, srcH, draw;
    if (mode === 'live') {
      if (!stream || !video.videoWidth) { toast('先にカメラを起動してください'); return; }
      srcW = video.videoWidth; srcH = video.videoHeight;
      draw = (ctx, cropX, cropY, cw, ch) => ctx.drawImage(video, cropX, cropY, cw, ch, 0, 0, OUT_W, OUT_H);
    } else {
      if (!stillImage) { toast('先に写真を選んでください'); return; }
      srcW = stillImage.naturalWidth; srcH = stillImage.naturalHeight;
      draw = (ctx, cropX, cropY, cw, ch) => ctx.drawImage(stillImage, cropX, cropY, cw, ch, 0, 0, OUT_W, OUT_H);
    }
    const frameRatio = OUT_W / OUT_H;
    const srcRatio = srcW / srcH;
    let cropW, cropH, cropX, cropY;
    if (srcRatio > frameRatio) { cropH = srcH; cropW = srcH * frameRatio; cropX = (srcW - cropW) / 2; cropY = 0; }
    else { cropW = srcW; cropH = srcW / frameRatio; cropX = 0; cropY = (srcH - cropH) / 2; }

    const canvas = document.createElement('canvas');
    canvas.width = OUT_W; canvas.height = OUT_H;
    const ctx = canvas.getContext('2d');
    draw(ctx, cropX, cropY, cropW, cropH);

    const k = OUT_W / r.width;
    if (tool === 'board') {
      drawBoard(ctx, pos.x * k, pos.y * k, 190 * scale * k);
      addHist('inProject', $('inProject').value);
      addHist('inWork', $('inWork').value);
      addHist('inMemo', $('inMemo').value);
    } else {
      drawAnnotations(ctx, k);
    }

    const dataURL = canvas.toDataURL('image/jpeg', 0.92);
    shots.push({ dataURL: dataURL, blob: dataURLtoBlob(dataURL) });
    updateBatch();
    toast(`保存待ちに追加しました（${shots.length}枚）`);
  }

  // ライブ映像の現在フレームを静止画として取り込み、編集できる状態にする
  function freezeLiveFrame() {
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    const img = new Image();
    img.onload = () => {
      stillImage = img;
      stillImg.src = c.toDataURL('image/jpeg', 0.92);
      stillImg.style.display = 'block';
      video.style.display = 'none';
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
      mode = 'still';
      $('modeBtn').textContent = '別の写真を選ぶ';
      $('backCamBtn').classList.remove('hidden');
      showBoard(); layoutAnn();
      toast('編集できます。黒板・メモ・書込みを追加してシャッターで保存');
    };
    img.src = c.toDataURL('image/jpeg', 0.92);
  }

  /* ---------- シャッター ---------- */
  let previewTimer = null, previewCount = 0;
  function cancelPreview() {
    if (previewTimer) { clearInterval(previewTimer); previewTimer = null; }
    $('shotHint').style.display = 'none';
  }
  $('shutter').addEventListener('click', () => {
    if (mode === 'live') {
      if (!stream || !video.videoWidth) { toast('先にカメラを起動してください'); return; }
      // 撮影プレビュー：3秒以内にタップで編集、無操作なら自動保存
      cancelPreview();
      previewCount = 3;
      $('shotCount').textContent = previewCount;
      $('shotHint').style.display = 'block';
      previewTimer = setInterval(() => {
        previewCount -= 1;
        if (previewCount <= 0) {
          cancelPreview();
          commitShot(); // 無操作 → そのまま保存待ちへ
        } else {
          $('shotCount').textContent = previewCount;
        }
      }, 1000);
    } else {
      // 写真モード（編集中）：そのまま保存待ちへ
      commitShot();
    }
  });

  // プレビュー中に画面タップ → 撮影フレームを固定して編集モードへ
  $('stage').addEventListener('click', () => {
    if (previewTimer) {
      cancelPreview();
      freezeLiveFrame();
    }
  });

  /* ---------- 保存待ちリスト ---------- */
  let shots = [];
  function updateBatch() {
    $('batchCount').textContent = shots.length;
    $('batchBar').classList.toggle('hidden', shots.length === 0);
    applyBoard(); // バー表示で画面配置が変わるため黒板を枠内に戻す
    layoutAnn();
  }
  // リストの確認画面（1枚ずつ削除可能）
  function renderList() {
    const list = $('resultList');
    list.innerHTML = '';
    if (shots.length === 0) {
      list.innerHTML = '<div class="empty">保存待ちの写真はありません</div>';
      return;
    }
    shots.forEach((s, i) => {
      const item = document.createElement('div');
      item.className = 'shotItem';
      const img = document.createElement('img');
      img.src = s.dataURL;
      const del = document.createElement('button');
      del.className = 'shotDel';
      del.textContent = '削除';
      del.addEventListener('click', () => {
        shots.splice(i, 1);
        updateBatch();
        renderList();
        toast(`削除しました（残り ${shots.length}枚）`);
      });
      item.appendChild(img);
      item.appendChild(del);
      list.appendChild(item);
    });
  }
  $('openListBtn').addEventListener('click', () => {
    renderList();
    $('result').style.display = 'flex';
  });

  /* ---------- 一覧の列数切替（1〜5列） ---------- */
  let cols = 1;
  try { cols = Math.min(5, Math.max(1, parseInt(localStorage.getItem('kokuban-cols')) || 1)); } catch (e) {}
  function setCols(n) {
    cols = Math.min(5, Math.max(1, n));
    $('resultList').style.setProperty('--cols', cols);
    $('colLabel').textContent = cols + '列';
    try { localStorage.setItem('kokuban-cols', cols); } catch (e) {}
  }
  setCols(cols);
  $('colBig').addEventListener('click', () => setCols(cols - 1));   // 列を減らす＝写真が大きく
  $('colSmall').addEventListener('click', () => setCols(cols + 1)); // 列を増やす＝写真が小さく

  // ピンチで拡大縮小
  let listPinch = null;
  const ldist = ts => Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
  $('resultList').addEventListener('touchstart', e => {
    if (e.touches.length === 2) listPinch = { d: ldist(e.touches), c: cols };
  }, { passive: true });
  $('resultList').addEventListener('touchmove', e => {
    if (!listPinch || e.touches.length !== 2) return;
    e.preventDefault();
    const ratio = ldist(e.touches) / listPinch.d;
    if (ratio > 1.25) { setCols(listPinch.c - 1); listPinch = { d: ldist(e.touches), c: cols }; }
    else if (ratio < 0.8) { setCols(listPinch.c + 1); listPinch = { d: ldist(e.touches), c: cols }; }
  }, { passive: false });
  $('resultList').addEventListener('touchend', () => { listPinch = null; });

  // dataURL → Blob 変換（同期処理）
  function dataURLtoBlob(dataURL) {
    const bin = atob(dataURL.split(',')[1]);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: 'image/jpeg' });
  }

  /* ---------- 黒板を Canvas に描く ---------- */
  function fitFontCanvas(ctx, text, maxW, base, min) {
    let s = base;
    while (s > min) {
      ctx.font = `${s}px "Hiragino Sans", sans-serif`;
      if (ctx.measureText(text).width <= maxW) break;
      s -= 0.5;
    }
    return s;
  }
  function wrapLine(ctx, text, maxW) {
    const lines = [];
    let line = '';
    for (const ch of (text || '')) {
      if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
      else line += ch;
    }
    lines.push(line);
    return lines;
  }
  function drawBoard(ctx, x, y, w) {
    const u = w / 190;                 // 1単位
    const padX = 10 * u, frame = 4 * u;
    const fsLabel = 12 * u, fsVal = 12 * u, baseLineH = 21 * u;
    const MIN_FS = 9 * u;              // 下限（これ以下は自動改行）
    const memo = $('inMemo').value;
    const valMaxW = w - padX * 2 - 58 * u;
    const memoMaxW = w - padX * 2;

    // 工事名・工種：縮小→下限に達したら自動改行
    const rows = [
      ['工事名', $('inProject').value],
      ['工　種', $('inWork').value]
    ].map(([label, val]) => {
      const vfs = fitFontCanvas(ctx, val || '', valMaxW, fsVal, MIN_FS);
      ctx.font = `${vfs}px "Hiragino Sans", sans-serif`;
      const vLines = wrapLine(ctx, val || '', valMaxW);
      const rowH = Math.max(baseLineH, vLines.length * (vfs * 1.45) + 7 * u);
      return { label, vLines, vfs, rowH };
    });

    // 撮影内容：手動改行を保ったまま全行共通サイズ、下限超えは自動改行
    const manualLines = (memo || '　').split('\n');
    let memoFs = fsVal;
    manualLines.forEach(line => {
      memoFs = Math.min(memoFs, fitFontCanvas(ctx, line, memoMaxW, fsVal, MIN_FS));
    });
    ctx.font = `${memoFs}px "Hiragino Sans", sans-serif`;
    const memoLines = [];
    manualLines.forEach(line => memoLines.push(...wrapLine(ctx, line, memoMaxW)));
    const memoLineH = memoFs * 1.5;
    const memoH = Math.max(46 * u, memoLines.length * memoLineH + 8 * u);
    const companyH = 20 * u;
    const rowsH = rows.reduce((sum, r) => sum + r.rowH, 0);
    const h = 8 * u + rowsH + memoH + companyH + 8 * u;

    // 枠と地
    ctx.fillStyle = '#d8d3c4';
    ctx.fillRect(x - frame, y - frame, w + frame * 2, h + frame * 2);
    ctx.fillStyle = '#0d5938';
    ctx.fillRect(x, y, w, h);

    // 行（工事名・工種）
    ctx.textBaseline = 'middle';
    let cy = y + 8 * u;
    rows.forEach(r => {
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${fsLabel}px "Hiragino Sans", sans-serif`;
      ctx.fillText(r.label, x + padX, cy + Math.min(r.rowH, baseLineH) / 2);
      ctx.font = `${r.vfs}px "Hiragino Sans", sans-serif`;
      let vy = cy + (r.vfs * 1.45) / 2 + 3 * u;
      r.vLines.forEach(line => {
        ctx.fillText(line, x + padX + 58 * u, vy);
        vy += r.vfs * 1.45;
      });
      cy += r.rowH;
      ctx.strokeStyle = 'rgba(255,255,255,.55)';
      ctx.lineWidth = 1 * u;
      ctx.beginPath(); ctx.moveTo(x + padX, cy); ctx.lineTo(x + w - padX, cy); ctx.stroke();
    });

    // メモ
    ctx.fillStyle = '#fff';
    ctx.font = `${memoFs}px "Hiragino Sans", sans-serif`;
    let my = cy + 6 * u + memoFs * 0.75;
    memoLines.forEach(line => {
      ctx.fillText(line, x + padX, my);
      my += memoLineH;
    });

    // 社名（右下）
    const compY = y + h - companyH;
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1 * u;
    ctx.beginPath(); ctx.moveTo(x + padX, compY); ctx.lineTo(x + w - padX, compY); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${11 * u}px "Hiragino Sans", sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText('㈱千田工務店', x + w - padX, compY + companyH / 2 + 2 * u);
    ctx.textAlign = 'left';
  }

  /* ---------- まとめて保存 ---------- */
  async function saveAll() {
    if (shots.length === 0) { toast('先に撮影してください'); return; }
    if (navigator.canShare) {
      try {
        const stamp = Date.now();
        const files = shots.map((s, i) =>
          new File([s.blob], `工事写真_${stamp}_${String(i + 1).padStart(2, '0')}.jpg`, { type: 'image/jpeg' })
        );
        if (navigator.canShare({ files: files })) {
          await navigator.share({ files: files });
          toast(`${shots.length}枚を保存しました`);
          shots = [];
          updateBatch();
          $('result').style.display = 'none';
          return;
        }
      } catch (e) {
        if (e && e.name === 'AbortError') return; // ユーザーがキャンセル
      }
    }
    // 共有が使えない場合：一覧画面で長押し保存を案内
    $('openListBtn').click();
    $('resultNote').textContent = '各画像を長押し →「写真に追加」で1枚ずつ保存してください';
    $('resultNote').style.color = '#e8a13a';
    toast('画像を長押しして保存してください', 3500);
  }
  $('saveAllBtn').addEventListener('click', saveAll);
  $('saveBtn').addEventListener('click', saveAll);
  $('retryBtn').addEventListener('click', () => {
    $('result').style.display = 'none';
  });
})();
</script>
</body>
